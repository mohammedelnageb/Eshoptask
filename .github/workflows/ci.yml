name: TechShop CI

on:
  push:
    branches: ["main", "master", "develop", "codex/**"]
  pull_request:

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build:tsc
      - run: npm run test:coverage -- --watchAll=false

  backend:
    name: Backend service tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - product-service
          - order-service
          - user-service
          - inventory-service
          - notification-service
          - payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test ${{ matrix.service }}
        run: mvn -B test
        working-directory: microservices/${{ matrix.service }}

  container-scan:
    name: Docker build and Trivy scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: techshop/frontend
            context: frontend
          - image: techshop/api-gateway
            context: microservices/api-gateway
          - image: techshop/product-service
            context: microservices/product-service
          - image: techshop/order-service
            context: microservices/order-service
          - image: techshop/user-service
            context: microservices/user-service
          - image: techshop/inventory-service
            context: microservices/inventory-service
          - image: techshop/notification-service
            context: microservices/notification-service
          - image: techshop/payment-service
            context: microservices/payment-service
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.image }}:ci ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  kubernetes-validate:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "${PWD}/infrastructure/kubernetes:/manifests:ro" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /manifests

groups:
  - name: techshop-service-health
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|product-service|order-service|user-service|inventory-service|notification-service|payment-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not scraped {{ $labels.job }} successfully for more than one minute."

      - alert: HighHttpServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is returning more than 0.5 server errors per second over five minutes."

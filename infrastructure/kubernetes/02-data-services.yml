apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: techshop
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: techshop_notifications
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: techshop-secrets
                  key: mongodb-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techshop-secrets
                  key: mongodb-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: techshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techshop-secrets
                  key: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: product-db
  namespace: techshop
spec:
  selector:
    app: product-db
  ports:
    - port: 5432
---

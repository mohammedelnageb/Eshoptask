apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-db
  namespace: techshop
spec:
  serviceName: product-db
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: techshop_product
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: techshop-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techshop-secrets
                  key: postgres-password
---

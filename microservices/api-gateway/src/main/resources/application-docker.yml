spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8081
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0

        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**
          filters:
            - StripPrefix=0

        - id: inventory-service
          uri: http://inventory-service:8084
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
  data:
    redis:
      host: redis
      port: 6379
      password: redispass
